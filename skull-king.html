<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Skull King</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pirata+One&family=Roboto:wght@400;700;900&display=swap');

        html, body {
            font-family: 'Roboto', sans-serif;
            background-color: #0f172a; /* slate-900 */
            color: white;
            overflow: hidden;
            touch-action: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            -webkit-touch-callout: none; /* Empêche le menu contextuel natif sur appui long */
        }
        .pirate-font { font-family: 'Pirata One', cursive; }
        
        /* Scrollbars */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }

        /* Animations */
        @keyframes popIn {
            0% { transform: scale(0.8) translateY(-20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-pop { animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade { animation: fadeIn 0.25s ease-out forwards; }
    </style>
</head>
<body class="flex flex-col select-none touch-manipulation overflow-hidden bg-slate-900">

    <!-- CONTAINER PRINCIPAL -->
    <div id="app" class="flex-1 w-full h-full flex flex-col relative overflow-hidden"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- FIREBASE INIT ---
        let app, auth, db, appId;
        let currentUser = null;
        let hasSavedScore = false;

        try {
            const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

            const initAuth = async () => {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            };
            initAuth();
            onAuthStateChanged(auth, user => { currentUser = user; });
        } catch (e) {
            console.warn("Firebase Init Error:", e);
        }

        // --- CONSTANTES ---
        const SUITS = { YELLOW: 'yellow', GREEN: 'green', PURPLE: 'purple', BLACK: 'black' };
        const TYPES = { NUMBER: 'number', ESCAPE: 'escape', PIRATE: 'pirate', MERMAID: 'mermaid', SK: 'sk', MARY: 'mary' };
        
        const CARD_STYLES = {
            yellow: 'bg-yellow-400 text-black border-yellow-600',
            green: 'bg-green-500 text-white border-green-800',
            purple: 'bg-purple-600 text-white border-purple-800',
            black: 'bg-slate-900 text-white border-slate-950',
            escape: 'bg-gray-100 text-gray-600 border-gray-400',
            pirate: 'bg-red-600 text-white border-red-900',
            mermaid: 'bg-cyan-400 text-slate-900 border-cyan-600',
            sk: 'bg-gradient-to-br from-slate-800 to-black text-yellow-400 border-yellow-500',
            mary: 'bg-gradient-to-br from-red-500 to-gray-300 text-black border-pink-600'
        };

        const ICONS = {
            yellow: '🟨', green: '🟩', purple: '🟪', black: '⬛',
            escape: '🏳️', pirate: '🏴‍☠️', mermaid: '🧜‍♀️', sk: '👑💀', mary: '👩‍🎤'
        };

        const CARD_INFO = {
            sk: {
                title: 'Skull King',
                icon: '👑💀',
                badge: 'Roi des Mers',
                badgeClass: 'bg-yellow-500 text-black',
                rules: [
                    'Bat toutes les cartes de couleur (y compris les atouts noirs) et tous les Pirates.',
                    'Bonus : Rapporte +30 pts par Pirate capturé dans le pli (si vous réussissez votre pari).',
                    'Point faible : Se fait battre par la Sirène !'
                ]
            },
            pirate: {
                title: 'Pirate',
                icon: '🏴‍☠️',
                badge: 'Personnage',
                badgeClass: 'bg-red-600 text-white',
                rules: [
                    'Bat toutes les cartes numérotées (couleurs et atouts noirs) ainsi que les Sirènes.',
                    'Si plusieurs Pirates sont joués dans le même pli, le premier posé l’emporte.',
                    'Point faible : Est battu par le Skull King.'
                ]
            },
            mermaid: {
                title: 'Sirène',
                icon: '🧜‍♀️',
                badge: 'Personnage',
                badgeClass: 'bg-cyan-400 text-slate-900',
                rules: [
                    'Bat toutes les cartes numérotées (couleurs et atouts noirs).',
                    'Pouvoir spécial : Bat le Skull King et rapporte un bonus de +50 pts !',
                    'Point faible : Se fait manger par les Pirates.'
                ]
            },
            mary: {
                title: 'Scary Mary',
                icon: '👩‍🎤',
                badge: 'Carte Caméléon',
                badgeClass: 'bg-pink-500 text-white',
                rules: [
                    'Au moment de la jouer, vous choisissez son pouvoir :',
                    '• Mode Pirate (🏴‍☠️) : Agit exactement comme un Pirate classique.',
                    '• Mode Fuite (🏳️) : Agit comme un drapeau blanc pour éviter de prendre le pli.'
                ]
            },
            escape: {
                title: 'Fuite (Drapeau Blanc)',
                icon: '🏳️',
                badge: 'Carte Spéciale',
                badgeClass: 'bg-gray-200 text-gray-800',
                rules: [
                    'Ne gagne jamais le pli, sauf si tous les joueurs posent une Fuite (le premier joueur remporte alors le pli).',
                    'Peut être jouée à tout moment, même si vous possédez la couleur demandée.'
                ]
            },
            black: {
                title: 'Atout Noir (Jolly Roger)',
                icon: '⬛',
                badge: 'Couleur Maîtresse',
                badgeClass: 'bg-slate-950 text-white border border-slate-600',
                rules: [
                    'C’est la couleur d’atout : un 1 Noir bat un 13 Jaune, Vert ou Violet.',
                    'Vous devez fournir du Noir s’il est demandé, sinon vous pouvez couper avec si vous n’avez pas la couleur demandée.',
                    'Est battu par les Pirates, Sirènes et le Skull King.'
                ]
            },
            yellow: {
                title: 'Carte Jaune (Coffres)',
                icon: '🟨',
                badge: 'Couleur Standard',
                badgeClass: 'bg-yellow-400 text-black',
                rules: [
                    'Couleur classique (valeurs de 1 à 13). La valeur la plus haute de la couleur demandée l’emporte.',
                    'Obligation de fournir la couleur demandée si vous en avez en main (les cartes spéciales peuvent toujours être jouées).'
                ]
            },
            green: {
                title: 'Carte Verte (Perroquets)',
                icon: '🟩',
                badge: 'Couleur Standard',
                badgeClass: 'bg-green-500 text-white',
                rules: [
                    'Couleur classique (valeurs de 1 à 13). La valeur la plus haute de la couleur demandée l’emporte.',
                    'Obligation de fournir la couleur demandée si vous en avez en main (les cartes spéciales peuvent toujours être jouées).'
                ]
            },
            purple: {
                title: 'Carte Violette (Cartes)',
                icon: '🟪',
                badge: 'Couleur Standard',
                badgeClass: 'bg-purple-600 text-white',
                rules: [
                    'Couleur classique (valeurs de 1 à 13). La valeur la plus haute de la couleur demandée l’emporte.',
                    'Obligation de fournir la couleur demandée si vous en avez en main (les cartes spéciales peuvent toujours être jouées).'
                ]
            }
        };

        const AI_NAMES = ['Barbe Noire', 'Anne Bonny', 'Jack Rackham', 'Bartholomew', 'Henry Morgan', 'Zheng Yi Sao'];

        // --- ETAT GLOBAL DU JEU ---
        let state = {
            phase: 'SETUP',
            players: [],
            round: 1,
            cardsToDeal: 0,
            dealerIdx: 0,
            currentTurnIdx: 0,
            trick: [],
            ledSuit: null,
            tricksPlayed: 0,
            lastTrickWinner: null,
            pendingMaryCard: null,
            inspectedCardKey: null, // Clé de la carte inspectée par appui long
            leaderboard: [],
            isLeaderboardLoading: false
        };

        let timers = [];
        let pressTimer = null;
        let isLongPressTriggered = false;

        // --- UTILITAIRES ---
        const clearAllTimers = () => { timers.forEach(clearTimeout); timers = []; };
        const safeTimeout = (cb, delay) => { const t = setTimeout(cb, delay); timers.push(t); return t; };

        const generateDeck = () => {
            let deck = [];
            let id = 0;
            Object.values(SUITS).forEach(suit => {
                for (let i = 1; i <= 13; i++) deck.push({ id: id++, type: TYPES.NUMBER, suit, value: i });
            });
            for (let i = 0; i < 5; i++) deck.push({ id: id++, type: TYPES.ESCAPE });
            for (let i = 0; i < 5; i++) deck.push({ id: id++, type: TYPES.PIRATE });
            for (let i = 0; i < 2; i++) deck.push({ id: id++, type: TYPES.MERMAID });
            deck.push({ id: id++, type: TYPES.SK });
            deck.push({ id: id++, type: TYPES.MARY });
            
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            return deck;
        };

        const getValidCards = (hand, ledSuit) => {
            if (!ledSuit) return hand;
            const hasLedSuit = hand.some(c => c.type === TYPES.NUMBER && c.suit === ledSuit);
            if (!hasLedSuit) return hand;
            return hand.filter(c => c.type !== TYPES.NUMBER || c.suit === ledSuit);
        };

        // --- GESTION APPUI LONG (LONG PRESS) ---
        window.startCardPress = (styleKey) => {
            isLongPressTriggered = false;
            clearTimeout(pressTimer);
            pressTimer = setTimeout(() => {
                isLongPressTriggered = true;
                state.inspectedCardKey = styleKey;
                if (navigator.vibrate) navigator.vibrate(40); // Petit retour haptique sur mobile
                render();
            }, 420);
        };

        window.cancelCardPress = () => {
            clearTimeout(pressTimer);
        };

        window.endCardPress = (cardId, isPlayable) => {
            clearTimeout(pressTimer);
            // Si l'appui long a ouvert la modale d'info, on ne joue pas la carte au relâchement
            if (isLongPressTriggered) {
                isLongPressTriggered = false;
                return;
            }
            if (isPlayable && cardId !== null) {
                window.handleCardClick(cardId);
            }
        };

        window.closeCardInfo = () => {
            state.inspectedCardKey = null;
            render();
        };

        // --- LOGIQUE METIER ---
        const dispatch = (action, payload) => {
            switch (action) {
                case 'START_GAME':
                    const numAIs = payload;
                    state.players = [{ id: 0, name: 'Vous (Humain)', isHuman: true, score: 0, hand: [], bid: null, tricks: 0, roundBonus: 0 }];
                    for (let i = 0; i < numAIs; i++) {
                        state.players.push({ id: i + 1, name: AI_NAMES[i % AI_NAMES.length], isHuman: false, score: 0, hand: [], bid: null, tricks: 0, roundBonus: 0 });
                    }
                    state.round = 1;
                    state.dealerIdx = Math.floor(Math.random() * state.players.length);
                    hasSavedScore = false;
                    dispatch('START_ROUND');
                    break;

                case 'START_ROUND':
                    state.trick = [];
                    state.ledSuit = null;
                    state.tricksPlayed = 0;
                    state.lastTrickWinner = null;
                    state.inspectedCardKey = null;
                    
                    const deck = generateDeck();
                    state.cardsToDeal = Math.min(state.round, Math.floor(66 / state.players.length));
                    
                    state.players.forEach(p => { 
                        p.hand = []; p.bid = null; p.tricks = 0; p.roundBonus = 0; 
                        for (let i = 0; i < state.cardsToDeal; i++) p.hand.push(deck.pop());
                    });
                    
                    state.players[0].hand.sort((a, b) => {
                        if (a.type === TYPES.NUMBER && b.type === TYPES.NUMBER) {
                            if (a.suit === SUITS.BLACK && b.suit !== SUITS.BLACK) return -1;
                            if (b.suit === SUITS.BLACK && a.suit !== SUITS.BLACK) return 1;
                            if (a.suit !== b.suit) return a.suit.localeCompare(b.suit);
                            return a.value - b.value;
                        }
                        if (a.type === TYPES.NUMBER) return -1;
                        if (b.type === TYPES.NUMBER) return 1;
                        return a.type.localeCompare(b.type);
                    });

                    state.phase = 'BIDDING';
                    state.currentTurnIdx = (state.dealerIdx + 1) % state.players.length;
                    render();
                    break;

                case 'HUMAN_BID':
                    state.players[0].bid = payload;
                    for (let i = 1; i < state.players.length; i++) {
                        let estimate = 0;
                        state.players[i].hand.forEach(c => {
                            if (c.type === TYPES.SK || c.type === TYPES.PIRATE) estimate += 1;
                            if (c.type === TYPES.MERMAID) estimate += 0.5;
                            if (c.type === TYPES.NUMBER && c.suit === SUITS.BLACK && c.value > 9) estimate += 0.5;
                        });
                        state.players[i].bid = Math.max(0, Math.min(Math.round(estimate), state.cardsToDeal));
                    }
                    state.phase = 'PLAYING';
                    render();
                    triggerAITurn();
                    break;

                case 'PENDING_MARY':
                    state.pendingMaryCard = payload;
                    state.phase = 'MARY_CHOICE';
                    render();
                    break;

                case 'PLAY_CARD':
                    const { playerIdx, cardId, maryChoice } = payload;
                    const player = state.players[playerIdx];
                    const cardIdx = player.hand.findIndex(c => c.id === cardId);
                    if (cardIdx === -1) return;

                    const card = player.hand.splice(cardIdx, 1)[0];
                    state.trick.push({ playerIdx, card, maryChoice });

                    if (state.trick.length === 1 && card.type === TYPES.NUMBER) {
                        state.ledSuit = card.suit;
                    }

                    if (state.trick.length === state.players.length) {
                        state.phase = 'TRICK_END';
                        render();
                        safeTimeout(() => dispatch('RESOLVE_TRICK'), 1500);
                    } else {
                        state.currentTurnIdx = (state.currentTurnIdx + 1) % state.players.length;
                        state.phase = 'PLAYING';
                        render();
                        triggerAITurn();
                    }
                    break;

                case 'RESOLVE_TRICK':
                    let hasSK = false, hasMermaid = false;
                    let pirates = [], mermaids = [], sks = [];

                    state.trick.forEach(play => {
                        const type = play.card.type === TYPES.MARY ? play.maryChoice : play.card.type;
                        if (type === TYPES.SK) { hasSK = true; sks.push(play); }
                        if (type === TYPES.MERMAID) { hasMermaid = true; mermaids.push(play); }
                        if (type === TYPES.PIRATE) pirates.push(play);
                    });

                    let winner = null;
                    let bonus = 0;

                    if (hasSK && hasMermaid) {
                        winner = mermaids[0]; bonus = 50;
                    } else if (hasSK) {
                        winner = sks[0]; bonus = 30 * pirates.length;
                    } else if (pirates.length > 0) {
                        winner = pirates[0];
                    } else if (mermaids.length > 0) {
                        winner = mermaids[0];
                    } else {
                        let bestNum = null;
                        state.trick.forEach(play => {
                            if (play.card.type === TYPES.NUMBER) {
                                if (!bestNum) bestNum = play;
                                else {
                                    if (play.card.suit === SUITS.BLACK && bestNum.card.suit !== SUITS.BLACK) bestNum = play;
                                    else if (play.card.suit === bestNum.card.suit && play.card.value > bestNum.card.value) bestNum = play;
                                }
                            }
                        });
                        winner = bestNum || state.trick[0];
                    }

                    const winnerIdx = winner.playerIdx;
                    state.players[winnerIdx].tricks += 1;
                    state.players[winnerIdx].roundBonus += bonus;
                    state.lastTrickWinner = state.players[winnerIdx].name;
                    
                    state.tricksPlayed += 1;
                    state.trick = [];
                    state.ledSuit = null;
                    state.currentTurnIdx = winnerIdx;

                    if (state.tricksPlayed >= state.cardsToDeal) {
                        dispatch('CALCULATE_SCORES');
                    } else {
                        state.phase = 'PLAYING';
                        render();
                        triggerAITurn();
                    }
                    break;

                case 'CALCULATE_SCORES':
                    state.players.forEach(p => {
                        if (p.bid === 0) {
                            p.score += (p.tricks === 0) ? (state.cardsToDeal * 10) : -(state.cardsToDeal * 10);
                        } else {
                            p.score += (p.bid === p.tricks) ? (p.tricks * 20 + p.roundBonus) : -(Math.abs(p.bid - p.tricks) * 10);
                        }
                    });
                    state.phase = 'ROUND_END';
                    render();
                    break;

                case 'NEXT_ROUND':
                    if (state.round >= 10) {
                        state.phase = 'GAME_OVER';
                        render();
                        saveAndFetchHighscores();
                    } else {
                        state.round++;
                        state.dealerIdx = (state.dealerIdx + 1) % state.players.length;
                        dispatch('START_ROUND');
                    }
                    break;
            }
        };

        const triggerAITurn = () => {
            if (state.phase !== 'PLAYING' || state.players[state.currentTurnIdx].isHuman) return;
            
            safeTimeout(() => {
                const ai = state.players[state.currentTurnIdx];
                const validCards = getValidCards(ai.hand, state.ledSuit);
                if (validCards.length > 0) {
                    const cardToPlay = validCards[Math.floor(Math.random() * validCards.length)];
                    let maryChoice = null;
                    if (cardToPlay.type === TYPES.MARY) {
                        maryChoice = (ai.tricks < ai.bid) ? TYPES.PIRATE : TYPES.ESCAPE;
                    }
                    dispatch('PLAY_CARD', { playerIdx: state.currentTurnIdx, cardId: cardToPlay.id, maryChoice });
                }
            }, 800);
        };

        const saveAndFetchHighscores = async () => {
            if (!currentUser || !db) return;
            state.isLeaderboardLoading = true;
            render();

            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'skull_king_highscores');
            
            if (!hasSavedScore) {
                try {
                    await addDoc(colRef, {
                        name: 'Joueur Anonyme',
                        score: state.players[0].score,
                        timestamp: Date.now(),
                        userId: currentUser.uid
                    });
                    hasSavedScore = true;
                } catch (e) {
                    console.error("Erreur save:", e);
                }
            }

            try {
                const snapshot = await getDocs(colRef);
                const scores = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                scores.sort((a, b) => b.score - a.score);
                state.leaderboard = scores.slice(0, 10);
            } catch (e) {
                console.error("Erreur fetch:", e);
            }
            state.isLeaderboardLoading = false;
            render();
        };

        // --- EXPORT POUR LE HTML ---
        window.handleAction = (action, payload) => dispatch(action, payload);
        window.handleCardClick = (cardId) => {
            if (state.phase !== 'PLAYING' || state.currentTurnIdx !== 0) return;
            const validCards = getValidCards(state.players[0].hand, state.ledSuit);
            const card = state.players[0].hand.find(c => c.id === cardId);
            if (!validCards.includes(card)) return;

            if (card.type === TYPES.MARY) {
                dispatch('PENDING_MARY', card);
            } else {
                dispatch('PLAY_CARD', { playerIdx: 0, cardId: card.id, maryChoice: null });
            }
        };

        // --- RENDU UI ---
        const renderCardHTML = (card, isPlayable = false, isBidding = false, isOnTable = false) => {
            if (!card) return '';
            const styleKey = card.type === TYPES.NUMBER ? card.suit : card.type;
            const classes = CARD_STYLES[styleKey] || CARD_STYLES.black;
            
            let content = "";
            if (card.type === TYPES.NUMBER) {
                content = `
                    <div class="flex flex-col items-center justify-between h-full p-1 relative w-full">
                        <span class="absolute top-1 left-1.5 text-xs sm:text-base font-black">${card.value}</span>
                        <span class="text-2xl sm:text-3xl my-auto drop-shadow-md">${ICONS[card.suit]}</span>
                        <span class="absolute bottom-1 right-1.5 text-xs sm:text-base font-black rotate-180">${card.value}</span>
                    </div>`;
            } else {
                content = `
                    <div class="flex flex-col items-center justify-center h-full w-full">
                        <div class="text-2xl sm:text-3xl drop-shadow-lg">${ICONS[card.type]}</div>
                    </div>`;
            }

            let stateFx = "opacity-60 scale-95";
            if (isPlayable) {
                stateFx = "cursor-pointer hover:-translate-y-2 hover:shadow-[0_0_15px_rgba(255,215,0,0.8)] z-10";
            } else if (isBidding || isOnTable) {
                stateFx = "opacity-100 scale-100";
            }

            const cardIdArg = isPlayable ? card.id : 'null';
            const pressHandlers = `
                onpointerdown="window.startCardPress('${styleKey}')"
                onpointerup="window.endCardPress(${cardIdArg}, ${isPlayable})"
                onpointerleave="window.cancelCardPress()"
                onpointercancel="window.cancelCardPress()"
                oncontextmenu="event.preventDefault()"
            `;

            return `
                <button type="button" ${pressHandlers} class="w-14 h-20 sm:w-20 sm:h-28 rounded-xl shadow-md border-2 flex-shrink-0 transition-all duration-200 ${classes} ${stateFx} relative select-none block p-0 m-0 outline-none appearance-none">
                    <div class="pointer-events-none w-full h-full flex flex-col">
                        ${content}
                    </div>
                </button>`;
        };

        const render = () => {
            const appDiv = document.getElementById('app');
            
            if (state.phase === 'SETUP') {
                appDiv.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center p-4">
                        <h1 class="text-5xl pirate-font text-yellow-500 mb-2 drop-shadow-[0_0_10px_rgba(234,179,8,0.8)] tracking-wider">SKULL KING</h1>
                        <p class="text-slate-400 mb-8 font-semibold">Le jeu de plis des pirates</p>
                        <div class="bg-slate-800 p-6 rounded-2xl shadow-2xl border-2 border-slate-700 w-full max-w-sm text-center">
                            <h2 class="text-xl mb-4 font-bold text-slate-200">Adversaires (IA)</h2>
                            <div class="flex flex-wrap justify-center gap-3">
                                ${[2,3,4,5,6].map(n => `<button onclick="window.handleAction('START_GAME', ${n})" class="w-14 h-14 bg-slate-700 hover:bg-yellow-500 hover:text-black font-bold text-xl rounded-xl transition-all shadow-md active:scale-95">${n}</button>`).join('')}
                            </div>
                        </div>
                    </div>`;
                return;
            }

            const human = state.players[0];
            const validHumanCards = state.phase === 'PLAYING' && state.currentTurnIdx === 0 ? getValidCards(human.hand, state.ledSuit) : [];
            const inspectedInfo = state.inspectedCardKey ? CARD_INFO[state.inspectedCardKey] : null;

            let html = `
                <!-- HEADER -->
                <div class="flex justify-between items-center px-4 py-2 bg-slate-950 border-b-2 border-slate-800 text-sm z-10 shrink-0 shadow-md">
                    <div class="font-black text-yellow-500 tracking-wider text-lg pirate-font">Manche ${state.round} / 10</div>
                    ${state.lastTrickWinner ? `<div class="text-cyan-400 animate-fade font-bold text-xs sm:text-sm">${state.lastTrickWinner} remporte le pli !</div>` : `<div class="text-[11px] text-slate-500 italic">Appui long sur une carte = pouvoir</div>`}
                </div>

                <!-- ZONE IA (Haut) -->
                <div class="flex justify-center gap-2 p-2 bg-slate-900 overflow-x-auto shrink-0 shadow-inner hide-scrollbar border-b border-slate-800">
                    ${state.players.slice(1).map(ai => `
                        <div class="flex flex-col items-center p-1.5 sm:p-2 rounded-xl min-w-[72px] transition-colors ${state.currentTurnIdx === ai.id && ['PLAYING', 'MARY_CHOICE', 'TRICK_END'].includes(state.phase) ? 'bg-yellow-600/20 border-2 border-yellow-500 shadow-[0_0_10px_rgba(234,179,8,0.5)]' : 'bg-slate-800 border-2 border-slate-700'}">
                            <span class="text-xs font-bold text-slate-200 truncate w-full text-center">${ai.name.split(' ')[0]}</span>
                            ${state.dealerIdx === ai.id ? `<span class="text-[10px] bg-white text-black px-1.5 py-0.5 rounded mt-0.5 font-bold">DLR</span>` : ''}
                            <div class="text-[11px] text-slate-300 mt-0.5">Pari: <span class="font-bold text-white">${ai.bid !== null ? ai.bid : '?'}</span></div>
                            <div class="text-xs text-green-400 font-bold">Plis: ${ai.tricks}</div>
                            <div class="text-[10px] text-slate-500">${ai.hand.length} 🎴</div>
                        </div>
                    `).join('')}
                </div>

                <!-- ZONE DE TABLE (Milieu) -->
                <div class="flex-1 min-h-0 relative flex items-center justify-center bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-700 to-slate-900 overflow-hidden">
                    
                    <!-- Cartes jouées -->
                    ${state.trick.map((play, idx) => {
                        const angle = (idx * (360 / state.players.length)) * (Math.PI / 180);
                        const radius = window.innerWidth < 400 ? 60 : 105;
                        let displayCard = play.card;
                        if (play.maryChoice) displayCard = { ...play.card, type: play.maryChoice };

                        return `
                            <div class="absolute transition-all duration-300 z-10 animate-fade" style="transform: translate(${Math.cos(angle) * radius}px, ${Math.sin(angle) * radius}px)">
                                <div class="text-[10px] text-center bg-black/80 text-white rounded px-1 mb-1 font-bold truncate w-full shadow-sm">${state.players[play.playerIdx].name.split(' ')[0]}</div>
                                ${renderCardHTML(displayCard, false, false, true)}
                            </div>
                        `;
                    }).join('')}

                    <!-- MODAL ENCHÈRES -->
                    ${state.phase === 'BIDDING' ? `
                        <div class="absolute inset-0 pointer-events-none flex items-center justify-center z-20 p-4">
                            <div class="pointer-events-auto bg-slate-900/95 p-5 rounded-2xl border-2 border-yellow-500 shadow-[0_0_30px_rgba(0,0,0,0.8)] text-center max-w-sm w-full animate-pop">
                                <h2 class="text-2xl font-black text-yellow-500 mb-1 drop-shadow-md pirate-font tracking-wider">Votre Pari</h2>
                                <p class="text-xs sm:text-sm text-slate-300 mb-4 font-semibold">Regardez vos cartes en bas (appui long pour l'aide).</p>
                                <div class="flex flex-wrap justify-center gap-2">
                                    ${[...Array(human.hand.length + 1)].map((_, i) => `
                                        <button onclick="window.handleAction('HUMAN_BID', ${i})" class="w-11 h-11 sm:w-12 sm:h-12 bg-yellow-500 hover:bg-yellow-400 text-black font-black text-lg sm:text-xl rounded-xl shadow-lg transition-transform active:scale-95">${i}</button>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <!-- MODAL MARY -->
                    ${state.phase === 'MARY_CHOICE' ? `
                        <div class="absolute inset-0 pointer-events-none flex items-center justify-center z-30">
                            <div class="pointer-events-auto bg-slate-900/95 p-6 rounded-2xl border-2 border-pink-500 shadow-2xl text-center animate-pop">
                                <h2 class="text-xl font-bold mb-4 text-pink-400">Scary Mary</h2>
                                <div class="flex gap-4">
                                    <button onclick="window.handleAction('PLAY_CARD', {playerIdx: 0, cardId: ${state.pendingMaryCard?.id}, maryChoice: '${TYPES.ESCAPE}'})" class="px-5 py-3 bg-gray-200 hover:bg-white text-black font-bold rounded-xl shadow-md">🏳️ Fuite</button>
                                    <button onclick="window.handleAction('PLAY_CARD', {playerIdx: 0, cardId: ${state.pendingMaryCard?.id}, maryChoice: '${TYPES.PIRATE}'})" class="px-5 py-3 bg-red-700 hover:bg-red-600 text-white font-bold rounded-xl shadow-md">🏴‍☠️ Pirate</button>
                                </div>
                            </div>
                        </div>
                    ` : ''}
                </div>

                <!-- ZONE DU JOUEUR (Bas) -->
                <div class="bg-slate-950 pt-2 px-2 pb-4 sm:pb-3 flex flex-col border-t-2 border-slate-800 shrink-0 z-10 shadow-[0_-5px_15px_rgba(0,0,0,0.5)] w-full" style="padding-bottom: max(1rem, env(safe-area-inset-bottom));">
                    <div class="flex justify-between items-center mb-1.5 px-2">
                        <div class="flex items-center gap-3">
                            <div class="text-sm font-black text-yellow-500 flex items-center gap-1.5">VOUS ${state.dealerIdx === 0 ? `<span class="text-[10px] bg-white text-black px-1.5 py-0.5 rounded font-bold">DLR</span>` : ''}</div>
                            <div class="text-xs text-slate-400 font-semibold">Score: <span class="text-white font-bold">${human.score}</span></div>
                        </div>
                        <div class="text-center">
                            ${state.phase === 'PLAYING' && state.currentTurnIdx === 0 ? `<span class="bg-yellow-500 text-black text-xs font-black px-3 py-1 rounded-full animate-pulse shadow-md">À vous !</span>` : ''}
                            ${state.phase === 'BIDDING' ? `<span class="text-yellow-400 text-xs font-bold animate-pulse">Vos cartes 👇</span>` : ''}
                        </div>
                        <div class="flex items-center gap-3 text-right">
                            <div class="text-xs text-slate-400 font-semibold">Pari: <span class="text-white font-bold">${human.bid !== null ? human.bid : '-'}</span></div>
                            <div class="text-xs text-green-400 font-semibold">Plis: <span class="font-bold text-green-300">${human.tricks}</span></div>
                        </div>
                    </div>
                    <!-- Main du joueur -->
                    <div class="flex gap-2 overflow-x-auto items-center py-1 px-2 hide-scrollbar min-h-[88px] sm:min-h-[120px] justify-start sm:justify-center">
                        ${human.hand.map(card => {
                            const isPlayable = (state.phase === 'PLAYING' && state.currentTurnIdx === 0) ? !!validHumanCards.find(c => c.id === card.id) : false;
                            const isBidding = state.phase === 'BIDDING';
                            return renderCardHTML(card, isPlayable, isBidding, false);
                        }).join('')}
                    </div>
                </div>

                <!-- MODAL INFO POUVOIR CARTE (APPUI LONG) -->
                ${inspectedInfo ? `
                    <div onclick="window.closeCardInfo()" class="fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade">
                        <div onclick="event.stopPropagation()" class="bg-slate-800 border-2 border-yellow-500 rounded-2xl p-5 max-w-sm w-full shadow-[0_0_30px_rgba(234,179,8,0.4)] animate-pop">
                            <div class="flex items-center gap-3 mb-3 border-b border-slate-700 pb-3">
                                <div class="text-4xl bg-slate-900 w-14 h-14 rounded-xl flex items-center justify-center border border-slate-700 shadow-inner">
                                    ${inspectedInfo.icon}
                                </div>
                                <div>
                                    <span class="text-[10px] uppercase tracking-wider font-black px-2 py-0.5 rounded ${inspectedInfo.badgeClass}">${inspectedInfo.badge}</span>
                                    <h3 class="text-xl font-black text-white mt-1">${inspectedInfo.title}</h3>
                                </div>
                            </div>
                            <ul class="space-y-2.5 text-sm text-slate-200 mb-5">
                                ${inspectedInfo.rules.map(rule => `
                                    <li class="flex items-start gap-2">
                                        <span class="text-yellow-500 font-bold mt-0.5">•</span>
                                        <span>${rule}</span>
                                    </li>
                                `).join('')}
                            </ul>
                            <button onclick="window.closeCardInfo()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-black py-3 rounded-xl shadow-md transition-transform active:scale-95">
                                Compris
                            </button>
                        </div>
                    </div>
                ` : ''}

                <!-- OVERLAY PLEIN ECRAN : FIN DE MANCHE -->
                ${state.phase === 'ROUND_END' ? `
                    <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
                        <div class="bg-slate-800 p-5 rounded-2xl w-full max-w-sm border-2 border-cyan-600 shadow-[0_0_25px_rgba(8,145,178,0.6)] animate-pop flex flex-col max-h-[90dvh]">
                            <h2 class="text-2xl sm:text-3xl font-black text-center text-cyan-400 mb-4 pirate-font tracking-wider shrink-0">Scores - Manche ${state.round}</h2>
                            <div class="flex flex-col gap-2 mb-5 overflow-y-auto pr-1 custom-scrollbar flex-1">
                                ${[...state.players].sort((a,b) => b.score - a.score).map(p => `
                                    <div class="flex justify-between items-center p-2.5 sm:p-3 rounded-xl ${p.isHuman ? 'bg-cyan-900/50 border border-cyan-500' : 'bg-slate-700/50 border border-slate-600'}">
                                        <span class="font-bold truncate w-5/12 text-sm">${p.name}</span>
                                        <div class="text-xs text-slate-300 w-4/12 text-center flex flex-col">
                                            <span>Pari: <strong class="text-white">${p.bid}</strong></span>
                                            <span>Fait: <strong class="text-white">${p.tricks}</strong></span>
                                        </div>
                                        <span class="font-black w-3/12 text-right text-lg ${p.score < 0 ? 'text-red-400' : 'text-green-400'}">${p.score}</span>
                                    </div>
                                `).join('')}
                            </div>
                            <button onclick="window.handleAction('NEXT_ROUND')" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-black text-lg py-3.5 rounded-xl shadow-lg transition-transform active:scale-95 shrink-0">
                                ${state.round === 10 ? 'Voir le Classement Final' : 'Manche Suivante'}
                            </button>
                        </div>
                    </div>
                ` : ''}

                <!-- OVERLAY PLEIN ECRAN : FIN DE PARTIE & LEADERBOARD -->
                ${state.phase === 'GAME_OVER' ? `
                    <div class="fixed inset-0 z-50 bg-slate-950 flex flex-col items-center p-4 overflow-y-auto custom-scrollbar pb-10">
                        <h1 class="text-4xl font-black text-yellow-500 mt-4 mb-6 drop-shadow-[0_0_15px_rgba(234,179,8,1)] text-center pirate-font tracking-wider">FIN DE PARTIE</h1>
                        <div class="w-full max-w-md flex flex-col gap-6 animate-fade">
                            <!-- Classement Final Local -->
                            <div class="bg-slate-800 p-4 rounded-2xl border-2 border-yellow-600 shadow-2xl">
                                <h2 class="text-xl text-yellow-500 font-bold mb-4 text-center border-b border-yellow-800 pb-2 pirate-font">Classement Final</h2>
                                <div class="flex flex-col gap-2">
                                    ${[...state.players].sort((a,b) => b.score - a.score).map((p, i) => `
                                        <div class="flex justify-between items-center text-sm md:text-base p-2 rounded ${p.isHuman ? 'bg-yellow-500/20 border border-yellow-500 text-yellow-400 font-bold' : 'text-slate-200'}">
                                            <span>${i+1}. ${p.name}</span>
                                            <span class="font-black">${p.score} pts</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            <!-- Leaderboard Global Firebase -->
                            <div class="bg-slate-800 p-4 rounded-2xl border-2 border-cyan-600 shadow-2xl">
                                <h2 class="text-xl text-cyan-400 font-bold mb-4 text-center border-b border-cyan-800 pb-2 pirate-font">Top 10 Mondial</h2>
                                ${state.isLeaderboardLoading ? `<p class="text-center text-slate-400 text-sm py-4 animate-pulse">Synchronisation cloud...</p>` : `
                                    <div class="flex flex-col gap-2">
                                        ${state.leaderboard.length === 0 ? `<p class="text-center text-slate-500">Aucun score disponible.</p>` : state.leaderboard.map((entry, idx) => {
                                            const isMe = currentUser && entry.userId === currentUser.uid;
                                            return `
                                                <div class="flex justify-between items-center text-sm p-2 rounded border ${isMe ? 'bg-cyan-900/40 border-cyan-400 text-white' : 'bg-slate-700/50 border-slate-600 text-slate-300'}">
                                                    <span class="font-bold">${idx + 1}. ${entry.name} ${isMe ? '<span class="text-cyan-400 text-xs">(Moi)</span>' : ''}</span>
                                                    <span class="font-black text-cyan-300">${entry.score} pts</span>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                `}
                            </div>
                            <button onclick="window.handleAction('START_GAME', ${state.players.length - 1})" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-black text-xl py-4 rounded-xl shadow-[0_0_20px_rgba(234,179,8,0.5)] transition-transform active:scale-95">Rejouer une partie</button>
                        </div>
                    </div>
                ` : ''}
            `;
            
            appDiv.innerHTML = html;
        };

        render();
    </script>
</body>
</html>
