<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail de Jeux HTML</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <div class="max-w-5xl mx-auto">
        <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-10 border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-4xl font-black text-amber-400">🎮 Arcade HTML</h1>
                <p id="pass-status" class="text-slate-400 mt-1">1 partie offerte par jeu • Pass illimité disponible</p>
            </div>
            <button id="header-code-btn" onclick="openUnlockModal(null)"
                    class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-4 py-2.5 rounded-xl self-start sm:self-auto">
                🔑 Déjà un code ?
            </button>
        </header>

        <div id="games-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </div>

    <!-- Modale Pass / Déblocage -->
    <div id="unlock-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-amber-500/50 rounded-2xl p-6 max-w-sm w-full text-center">
            <h2 class="text-2xl font-bold text-amber-400 mb-2">Débloquer tous les jeux</h2>
            <p id="modal-game-name" class="text-sm text-slate-300 mb-3"></p>
            <p class="text-xs text-slate-400 mb-4">
                Votre partie gratuite sur ce jeu est terminée. Obtenez le Pass complet puis entrez votre code unique :
            </p>
            <a id="payment-link" href="#" target="_blank" rel="noopener"
               class="block w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl mb-4">
                💳 Acheter le Pass Tous les Jeux
            </a>
            <input id="unlock-code-input" type="text" placeholder="Votre code unique"
                   class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white text-center mb-3 uppercase">
            <div class="flex gap-2">
                <button onclick="verifyUniversalCode()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-xl">
                    Valider le code
                </button>
                <button onclick="closeUnlockModal()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold px-4 py-2 rounded-xl">
                    Fermer
                </button>
            </div>
            <p id="unlock-error" class="text-xs text-red-400 mt-2 hidden">Code incorrect. Vérifiez votre saisie.</p>
        </div>
    </div>

    <script>
        const GAMES = [
            { id: 'empire', title: "L'Âge des Rois", tag: 'Stratégie / Mobile', file: 'empire-rois.html' },
            { id: 'assiette', title: "L'Assiette Équilibrée", tag: '2 Joueurs', file: 'assiette-multi.html' },
            { id: 'tcg', title: 'Dark Fantasy TCG', tag: 'Cartes vs IA', file: 'dark-fantasy.html' },
            { id: 'echecs', title: "Jeu d'Échecs", tag: 'Solo / 2 Joueurs', file: 'echecs.html' },
            { id: 'foret-local', title: 'Écosystème Forêt (Scores)', tag: 'Draft Solo', file: 'ecosysteme-foret.html' },
            { id: 'foret-solo', title: 'Écosystème Forêt (Classique)', tag: 'Draft Solo', file: 'ecosystemeforet-old.html' },
            { id: 'explorateurs', title: 'Explorateurs Mobile', tag: 'Exploration vs IA', file: 'explorateurs.html' },
            { id: 'got-five', title: 'Got Five !', tag: 'Déduction', file: 'got-five.html' },
            { id: 'gemmes', title: 'Marchands de Gemmes', tag: 'Gestion / IA & 2J', file: 'splendor.html' },
            { id: 'motocross', title: 'Motocross', tag: 'Jeux Flash', file: 'motocross.html' },
            { id: 'pokemon', title: 'Pokémon', tag: 'RPG', file: 'poket11.html' },
            { id: 'skullking', title: 'Skull King', tag: 'Jeux de cartes', file: 'skull-king.html' },
            { id: 'shotten', title: 'Schotten Totten', tag: 'Jeux de cartes', file: 'schotten-totten.html' },
            { id: 'monopoly', title: 'Monopoly Pocket', tag: 'Plateau 2 Joueurs', file: 'Monopoly.html' }
        ];

        // Code unique pour débloquer tous les jeux
        const UNIVERSAL_CODE = 'REPLAY2026';
        const PAYMENT_URL = 'https://example.com/paiement';

        function isPassActive() {
            return localStorage.getItem('unlocked_all') === '1';
        }

        function getPlaysCount(gameId) {
            return parseInt(localStorage.getItem('plays_' + gameId) || '0', 10);
        }

        function openUnlockModal(game = null) {
            document.getElementById('modal-game-name').innerText = game
                ? `Jeu concerné : ${game.title}`
                : 'Accès illimité à tous les jeux';
            document.getElementById('payment-link').href = PAYMENT_URL;
            document.getElementById('unlock-error').classList.add('hidden');
            document.getElementById('unlock-code-input').value = '';
            const modal = document.getElementById('unlock-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeUnlockModal() {
            const modal = document.getElementById('unlock-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function verifyUniversalCode() {
            const code = document.getElementById('unlock-code-input').value.trim().toUpperCase();
            if (code === UNIVERSAL_CODE) {
                localStorage.setItem('unlocked_all', '1');
                closeUnlockModal();
                renderCatalog();
            } else {
                document.getElementById('unlock-error').classList.remove('hidden');
            }
        }

        function handleLaunchGame(game) {
            if (isPassActive() || getPlaysCount(game.id) < 1) {
                localStorage.setItem('plays_' + game.id, String(getPlaysCount(game.id) + 1));
                window.location.href = game.file;
            } else {
                openUnlockModal(game);
            }
        }

        function renderCatalog() {
            const active = isPassActive();
            document.getElementById('pass-status').innerText = active
                ? '✅ Pass activé : rejouabilité illimitée sur tous les jeux'
                : '1 partie offerte par jeu • Pass illimité disponible';

            const codeBtn = document.getElementById('header-code-btn');
            codeBtn.style.display = active ? 'none' : 'inline-block';

            const grid = document.getElementById('games-grid');
            grid.innerHTML = '';

            GAMES.forEach(game => {
                const plays = getPlaysCount(game.id);
                const freeLeft = !active && plays < 1;

                const card = document.createElement('div');
                card.className = 'bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between';
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center gap-2">
                            <span class="text-xs uppercase font-bold text-amber-400">${game.tag}</span>
                            <span class="text-xs px-2 py-0.5 rounded-full ${active ? 'bg-emerald-950 text-emerald-400' : (freeLeft ? 'bg-blue-950 text-blue-300' : 'bg-amber-950 text-amber-300')}">
                                ${active ? 'Illimité' : (freeLeft ? '1 essai gratuit' : 'Payant')}
                            </span>
                        </div>
                        <h2 class="text-xl font-bold mt-2 mb-4">${game.title}</h2>
                    </div>
                    <button class="w-full ${active || freeLeft ? 'bg-indigo-600 hover:bg-indigo-500' : 'bg-amber-600 hover:bg-amber-500'} text-white font-bold py-2.5 rounded-xl">
                        ${active || freeLeft ? 'Jouer' : 'Débloquer'}
                    </button>
                `;
                card.querySelector('button').onclick = () => handleLaunchGame(game);
                grid.appendChild(card);
            });
        }

        const params = new URLSearchParams(window.location.search);
        const paywallId = params.get('paywall');
        renderCatalog();
        if (paywallId && !isPassActive()) {
            const found = GAMES.find(g => g.id === paywallId);
            openUnlockModal(found || null);
        }
    </script>
</body>
</html>
